name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q modernguns-fabric-1.20.1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: cd modernguns && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: modernguns-jar
          path: modernguns/build/libs/modernguns-*.jar
